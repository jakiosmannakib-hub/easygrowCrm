name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the test run. Mirrors the local docker-compose
    # setup (PUL-002) so integration tests hit a real database, not a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: easygrowcrm
          POSTGRES_PASSWORD: easygrowcrm_dev
          POSTGRES_DB: easygrowcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easygrowcrm -d easygrowcrm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # Point the app/tests at the CI Postgres service above.
      DATABASE_URL: postgresql://easygrowcrm:easygrowcrm_dev@localhost:5432/easygrowcrm_test
      TEST_DATABASE_URL: postgresql://easygrowcrm:easygrowcrm_dev@localhost:5432/easygrowcrm_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
