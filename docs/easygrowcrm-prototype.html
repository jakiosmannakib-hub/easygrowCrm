<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyGrowCrm — Interactive Prototype</title>
<style>
:root{
  --ink:#16232e; --ink2:#44566b; --mut:#7c8ba1;
  --bg:#eef1f5; --card:#ffffff; --line:#e2e8f0; --line2:#eef2f7;
  --brand:#0d7e72; --brand-soft:#e2f3f0; --brand-ink:#0a5f56;
  --side:#132029; --side-ink:#b9c6cf; --side-act:#1d3540;
  --green:#1f9d62; --green-soft:#e3f5ec;
  --blue:#2f80ed; --blue-soft:#e8f1fd;
  --amber:#e8a13d; --amber-soft:#fdf3e3;
  --red:#d64545; --red-soft:#fbe9e9;
  --purple:#8e5ad1; --purple-soft:#f1e9fb;
  --gray:#9aa5b1; --gray-soft:#eef1f4;
  --radius:10px;
  --shadow:0 1px 2px rgba(22,35,46,.06),0 4px 16px rgba(22,35,46,.06);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none}
select,input,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9d3dd;border-radius:6px}

/* ---------- shell ---------- */
#app{display:flex;height:100vh}
#sidebar{width:228px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;letter-spacing:.5px}
.logo b{font-size:16px;letter-spacing:.3px}
.logo span{display:block;font-size:10.5px;color:#6d8290;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;color:var(--side-ink);font-size:13.5px;font-weight:500;text-align:left;margin-bottom:2px}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--side-act);color:#fff}
.nav-item.active svg{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.demo-switch{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:10px}
.demo-switch label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8fa4b0;font-weight:700;display:block;margin-bottom:6px}
.demo-switch select{width:100%;background:#0e1a21;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 8px;font-size:13px}
.side-user{display:flex;align-items:center;gap:9px;padding:10px 4px 2px}
.side-user .who b{display:block;font-size:13px;color:#fff}
.side-user .who span{font-size:11px;color:#7d93a0}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:var(--card);border-bottom:1px solid var(--line);padding:0 26px;height:62px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header .title h1{font-size:17px;font-weight:700}
header .title p{font-size:12px;color:var(--mut)}
header .spacer{flex:1}
.clockbox{display:flex;align-items:center;gap:7px;background:var(--gray-soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.clockbox b{font-variant-numeric:tabular-nums}
.clockbox button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--brand-ink)}
.clockbox button:hover{border-color:var(--brand)}
.bell{position:relative;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.bell:hover{background:var(--gray-soft)}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#content{flex:1;overflow-y:auto;padding:24px 26px 60px}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .card-h{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .card-h h3{font-size:14px;font-weight:700}
.card .card-h .sub{font-size:12px;color:var(--mut)}
.card .card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:#c4cfda;color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.big{padding:13px 26px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{color:var(--mut);font-size:12.5px;text-decoration:underline;padding:4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:#fafbfd;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:14px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.sm{padding:2px 9px;font-size:11px}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.avatar.sm{width:24px;height:24px;font-size:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}
.mut{color:var(--mut)} .small{font-size:12px} .tnum{font-variant-numeric:tabular-nums}
.overdue{color:var(--red);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--mut);font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:#fff}
.field textarea{resize:vertical;min-height:64px}
.field .err{color:var(--red);font-size:12px;margin-top:4px;display:none}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--red)}
.field.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand-ink);border-color:var(--brand)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff}
.notice{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.notice.warn{background:var(--amber-soft);color:#8a5a12;border:1px solid #f2ddb5}
.notice.info{background:var(--blue-soft);color:#1d5db0;border:1px solid #cfe2f9}
.notice.ok{background:var(--green-soft);color:#14683f;border:1px solid #c4e8d4}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,32,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:44px 16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 24px 64px rgba(10,20,30,.35);animation:pop .16s ease}
.modal.lg{max-width:780px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal .m-h{padding:18px 22px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:12px}
.modal .m-h h2{font-size:16px;font-weight:700}
.modal .m-h p{font-size:12.5px;color:var(--mut);margin-top:2px}
.modal .m-h .x{margin-left:auto;font-size:20px;color:var(--mut);line-height:1;padding:2px 6px;border-radius:6px}
.modal .m-h .x:hover{background:var(--gray-soft)}
.modal .m-b{padding:18px 22px;max-height:62vh;overflow-y:auto}
.modal .m-f{padding:14px 22px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:10px;align-items:center}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#16232e;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .2s ease;max-width:360px}
.toast.err{background:#a83232}

/* notifications panel */
#npanel{position:fixed;top:0;right:-360px;width:340px;height:100vh;background:#fff;border-left:1px solid var(--line);z-index:60;transition:right .2s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#npanel.open{right:0}
#npanel .np-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#npanel .np-h h3{font-size:14px;font-weight:700;flex:1}
.np-list{flex:1;overflow-y:auto}
.np-item{padding:12px 18px;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.4;display:flex;gap:9px}
.np-item.unread{background:#f4f9f8}
.np-item .t{font-size:11px;color:var(--mut);margin-top:3px}

/* timer ring — the signature */
.timer-wrap{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:148px;height:148px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--line2)}
.ring .prog{stroke:var(--ink2);transition:stroke-dashoffset .4s ease,stroke .3s ease;stroke-linecap:round}
.ring.done .prog{stroke:var(--green)}
.ring.break .prog{stroke:var(--blue)}
.ring.overbreak .prog{stroke:var(--red)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid .big{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .mid .lab{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.ring.done .mid .big{color:var(--green)}

/* board */
.bgroup{margin-bottom:18px}
.bg-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px 8px 0 0;color:#fff;font-weight:700;font-size:13px}
.bg-body{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;background:#fff;overflow:hidden}
.brow{display:grid;grid-template-columns:minmax(220px,2.4fr) 44px 165px 105px 95px 70px;align-items:center;gap:8px;padding:8px 12px 8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.brow:last-child{border-bottom:none}
.brow .stripe{width:5px;align-self:stretch;margin-right:9px;border-radius:0}
.brow .ttl{display:flex;align-items:center;min-width:0}
.brow .ttl button{font-weight:600;color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .ttl button:hover{color:var(--brand-ink);text-decoration:underline}
.brow.head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;background:#fafbfc}
.distbar{height:5px;display:flex;overflow:hidden;border-radius:0 0 8px 8px}
.pillsel{position:relative;display:inline-block}
.pillsel .pill{cursor:pointer;border:none;width:130px;justify-content:center}
.pillsel .pill.lock{cursor:default;opacity:.9}
.pillsel .dd{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:20;min-width:190px;padding:5px;display:none}
.pillsel.open .dd{display:block}
.pillsel .dd button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;font-weight:600}
.pillsel .dd button:hover{background:var(--gray-soft)}
.stars{display:inline-flex;gap:2px}
.stars button,.stars span{font-size:17px;color:#d5dde5}
.stars .on{color:var(--amber)}
.stars button:hover{transform:scale(1.15)}
.checkrow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px}
.checkrow input{width:15px;height:15px;accent-color:var(--brand)}
.checkrow.done span{text-decoration:line-through;color:var(--mut)}
.sec-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:18px 0 8px}
.sec-lab:first-child{margin-top:0}
.comment{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.comment:last-child{border:none}
.google-btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:600;background:#fff}
.google-btn:hover{background:#f7f9fb;border-color:#c6d1dc}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#f6f8fa;border:1px solid var(--line2);border-radius:6px;padding:6px 9px;color:var(--ink2);white-space:pre-wrap}

@media(max-width:860px){
  #sidebar{width:64px}
  .logo b,.logo span,.nav-item span,.demo-switch,.side-user .who{display:none}
  .nav-item{justify-content:center;padding:11px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .brow{grid-template-columns:minmax(140px,2fr) 40px 120px}
  .brow>*:nth-child(n+5){display:none}
}
</style>
</head>
<body>

<div id="signin-screen" style="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100">
  <div class="card" style="width:380px;padding:34px 32px;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:14px"><div class="logo" style="padding:0;color:var(--ink)"><div class="mark">E</div><div style="text-align:left"><b>EasyGrowCrm</b><span>Internal CRM</span></div></div></div>
    <p class="mut" style="font-size:13px;margin-bottom:22px">Sign in with your company Google account.<br>No passwords. No signup.</p>
    <button class="google-btn" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.4-4.1 7.2-10.1 7.2-17.5z"/><path fill="#FBBC05" d="M10.4 28.7a14.5 14.5 0 010-9.4l-7.8-6.1a24 24 0 000 21.6l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.4-5.8c-2 1.4-4.7 2.2-7.8 2.2-6.3 0-11.7-3.9-13.6-9.4l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <p class="mut" style="font-size:11.5px;margin-top:18px">Not registered? Contact HR — accounts are provisioned in advance.</p>
    <div style="margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);font-size:11px;color:var(--mut)">PROTOTYPE · demo only · click to enter as the CEO, then use the role switcher</div>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="logo"><div class="mark">E</div><div><b>EasyGrowCrm</b><span>Internal CRM</span></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-user" id="side-user"></div>
      <div class="demo-switch">
        <label>Demo — switch role</label>
        <select id="role-switch" onchange="switchUser(this.value)"></select>
      </div>
      <button class="nav-item" style="margin-top:8px" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Log out</span></button>
    </div>
  </aside>
  <div id="main">
    <header>
      <div class="title"><h1 id="pg-title"></h1><p id="pg-sub"></p></div>
      <div class="spacer"></div>
      <div class="clockbox" id="clockbox"></div>
      <button class="bell" onclick="togglePanel()" title="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#44566b" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot" id="bell-dot" style="display:none"></span>
      </button>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="npanel">
  <div class="np-h"><h3>Notifications</h3><button class="btn link" onclick="markAllRead()">Mark all read</button><button class="btn ghost" style="padding:4px 10px;margin-left:8px" onclick="togglePanel()">✕</button></div>
  <div class="np-list" id="np-list"></div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
/* =============== MOCK DATA =============== */
const AV=["#0d7e72","#2f80ed","#8e5ad1","#e8a13d","#d64545","#4a7ab5","#6b8e23"];
const users=[
 {id:"u1",name:"Arif Chowdhury",role:"super_admin",title:"CEO",dept:"Leadership",active:true},

 {id:"u5",name:"Rifat Hasan",role:"employee",title:"SEO Executive",dept:"SEO",active:true},
 {id:"u6",name:"Tania Islam",role:"employee",title:"Content Writer",dept:"Content",active:true},
 {id:"u7",name:"Imran Kabir",role:"employee",title:"Link-building Exec",dept:"SEO",active:true},
];
const ROLE_LABEL={super_admin:"Super Admin",team_leader:"Team Leader",project_manager:"Project Manager",admin_hr:"Admin / HR",employee:"Employee"};
const MGR=["super_admin","team_leader","project_manager"];
const isMgr=u=>MGR.includes(u.role)||u.role==="admin_hr"; // admin_hr shares manager-facing pages except QA
const canReview=u=>MGR.includes(u.role);
const clients=[{id:"c1",name:"Bright Smile Dental"},{id:"c2",name:"Authentic Makeup BD"},{id:"c3",name:"The Window Source"}];
const projects=[
 {id:"p1",clientId:"c1",name:"Local SEO Retainer",type:"Retainer",month:8,status:"active"},
 {id:"p2",clientId:"c2",name:"Website Redesign",type:"One-off",month:null,status:"active"},
];
const CAT_COLOR={"On-page SEO":"#2f80ed","Content":"#8e5ad1","Technical":"#e8a13d","Link Building":"#0d7e72","Design":"#d64545","Reporting":"#4a7ab5"};
let tasks=[

const _MO_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(due){
 // Base: Aug 8 2026 = day-of-year offset. We just add/subtract days.
 const base=new Date(2026,7,8); // Aug 8 2026
 const d=new Date(base.getTime()+due*86400000);
 return `${_MO_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function timerCard(){
 const R=64,C=2*Math.PI*R;
 if(!S.att){return `<div class="card"><div class="card-b" style="text-align:center;padding:36px">
   <p class="mut" style="margin-bottom:16px">You haven't signed in yet.</p>
   <button class="btn primary big" onclick="openSignIn()">Sign In</button>
   <p class="small mut" style="margin-top:12px">Shift 9:00 AM – 6:00 PM · 7h work + 1h break</p></div></div>`}
 if(S.att.out){return `<div class="card"><div class="card-b" style="text-align:center;padding:30px">
   <div class="notice ok" style="justify-content:center">Signed out at ${fmtClock(S.att.out)} · ${S.att.exit==="early"?"⚠ Early (flagged)":S.att.exit==="half"?"Half day":"Full day"} · net ${fmtMin(S.att.netFinal)}</div></div></div>`}
 const net=netMin(),tgt=myTarget(),done=net>=tgt,bm=breakMin(),ob=onBreak(),over=bm>BREAK_ALLOW;
 const frac=Math.min(1,net/tgt),off=C*(1-frac);
 const cls=ob?(over?"overbreak":"break"):done?"done":"";
 return `<div class="card"><div class="card-b">
 <div class="timer-wrap">
  <div class="ring ${cls}"><svg width="148" height="148"><circle class="track" cx="74" cy="74" r="${R}" fill="none" stroke-width="11"/><circle class="prog" cx="74" cy="74" r="${R}" fill="none" stroke-width="11" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
   <div class="mid"><span class="big">${ob?fmtMin(bm):fmtMin(net)}</span><span class="lab">${ob?(over?"Break exceeded":"On break"):done?"Target reached":"of "+fmtMin(tgt)+" net"}</span></div></div>
  <div style="flex:1">
   <p style="font-weight:700;margin-bottom:2px">Signed in at ${fmtClock(S.att.signInAt)} ${S.att.signInAt>GRACE?'<span class="pill sm" style="background:var(--red-soft);color:#a8331f;margin-left:6px">Late</span>':""}</p>
   <p class="small mut" style="margin-bottom:12px">${S.att.workType} · break used ${fmtMin(bm)} of ${fmtMin(BREAK_ALLOW)} ${over?'· <b style="color:var(--red)">Break exceeded</b>':""} ${tgt===HALF_TARGET?"· <b>Half-day (target 3h 30m)</b>":""}</p>
   <div style="display:flex;gap:9px;flex-wrap:wrap">
    ${ob?`<button class="btn ghost" onclick="endBreak()">End break</button>`:`<button class="btn ghost" onclick="openBreak()">Take a break</button>`}
    <button class="btn primary" ${done?"":"disabled"} onclick="openSignOut(false)">${done?"Sign Out":"Sign Out — locked until "+fmtMin(tgt)+" net"}</button>
   </div>
   <button class="btn link" onclick="openSignOut(true)" style="margin-top:6px">Sign out early (requires a reason — will be flagged)</button>
  </div>
 </div></div></div>`;
}

function soRowChange(){
 let anyNotDone=false;
 S.att.plan.forEach((p,i)=>{const st=document.querySelector(`[data-so-st="${i}"]`).value;
  if(st!=="done")anyNotDone=true;
  const sub=document.querySelector(`[data-so-sub="${i}"]`);if(sub)sub.style.display=(p.linked&&st==="done")?"block":"none"});
 $("#so-exp-wrap").style.display=anyNotDone?"block":"none";
}
function doSignOut(early){
 if(early){const r=$("#so-reason");if(!r.value.trim()){r.closest(".field").classList.add("invalid");return}}
 let anyNotDone=false;const subs=[];
 for(let i=0;i<S.att.plan.length;i++){const p=S.att.plan[i];const st=document.querySelector(`[data-so-st="${i}"]`).value;
  if(st!=="done")anyNotDone=true;
  if(p.linked&&st==="done"){const t=tasks.find(x=>x.id===p.taskId);
   const sum=document.querySelector(`[data-so-sum="${i}"]`),proof=document.querySelector(`[data-so-proof="${i}"]`).value.trim();
   if(!sum.value.trim()){sum.closest(".field").classList.add("invalid");toast(`“${t.title}”: summary is required.`,true);return}
   const un=t.checklist.filter(c=>!c.done).length;
   if(un){toast(`“${t.title}”: checklist has ${un} unchecked item${un>1?"s":""} — nothing was saved.`,true);return}
   if(t.proofReq&&!proof&&!t.proof){toast(`“${t.title}”: proof is required — nothing was saved.`,true);return}
   subs.push({t,summary:sum.value.trim(),proof,reviewer:document.querySelector(`[data-so-rev="${i}"]`).value});
  }}
 if(anyNotDone&&!early){const e=$("#so-exp");if(!e.value.trim()){e.closest(".field").classList.add("invalid");return}}
 if(anyNotDone&&early){const e=$("#so-exp");if(e&&!e.value.trim()){/* early reason covers it */}}
 // atomic apply
 subs.forEach(s=>{s.t.status="submitted";if(s.proof)s.t.proof=s.proof;s.t.submission={by:S.user.id,summary:s.summary,hours:s.t.actual,issues:"",reviewer:s.reviewer,at:fmtClock(S.clock)};
  logAudit("project_task.submitted","project_task",s.t.id,`status → submitted · reviewer: ${byId(s.reviewer).name}`);
  notify(s.reviewer,`${S.user.name} submitted “${s.t.title}” for your review.`)});
 const done=S.att.plan.filter((p,i)=>document.querySelector(`[data-so-st="${i}"]`)?.value==="done").length;
 eods.unshift({id:"r"+Date.now(),by:S.user.id,date:"Today",done,total:S.att.plan.length,planH:6,actH:null,note:$("#so-exp")?.value||$("#so-tmr").value||"",reviewedBy:null,flagged:false,mnote:null});
 S.att.out=S.clock;S.att.netFinal=netMin();S.att.exit=early?"early":(myTarget()===HALF_TARGET?"half":"normal");
 logAudit(early?"attendance.signed_out_early":"attendance.signed_out","attendance","today",`net ${fmtMin(S.att.netFinal)} · break ${fmtMin(breakMin())}${early?` · reason: “${$("#so-reason").value.trim()}”`:""}`,"attendance");
 if(early)notifyMgrs(`${S.user.name} signed out early: “${$("#so-reason").value.trim()}”`);
 closeModal();render();toast(early?"Signed out early — flagged and managers notified.":"Signed out. "+(subs.length?subs.length+" task(s) sent to review.":"Day saved."));
}

function statusPillSel(t){
 const me=S.user,mine=t.assignee===me.id,mgr=canReview(me);
 const locked=["submitted","approved","completed","cancelled"].includes(t.status);
 const dep=t.dependsOn&&!["approved","completed"].includes(tasks.find(x=>x.id===t.dependsOn)?.status);
 if(dep&&!locked)return `<span class="pill sm" style="background:var(--purple-soft);color:#6a3fa8" title="Waiting on dependency">🔒 Blocked</span>`;
 if((!mine&&!mgr)||(locked&&!mgr))return pillHTML(t.status,1);
 const opts=mgr?[["planned"],["in_progress"],["blocked"],["revision"],["completed"],["cancelled"]]:[["planned"],["in_progress"],["blocked"]];
 const canSub=mine&&["planned","in_progress","revision"].includes(t.status)&&!dep;
 return `<span class="pillsel" onclick="event.stopPropagation();this.classList.toggle('open')">
  <button class="pill sm" style="background:${STATUS[t.status].bg};color:${STATUS[t.status].fg}">${STATUS[t.status].shield?shield:""}${STATUS[t.status].l} ▾</button>
  <div class="dd">${opts.map(([k])=>`<button onclick="chStatus('${t.id}','${k}')" style="color:${STATUS[k].fg}">${STATUS[k].l}${k==="completed"?" (skip QC)":""}</button>`).join("")}
  ${canSub?`<button style="color:var(--brand-ink);border-top:1px solid var(--line2)" onclick="openSubmit('${t.id}')">➤ Submit for review…</button>`:""}</div></span>`;
}
function chStatus(id,st){
 const t=tasks.find(x=>x.id===id);
 if(st==="revision"&&canReview(S.user)){openModal(mhead("Send back for revision","A note is mandatory")+`<div class="m-b"><div class="field"><label>Revision note *</label><textarea id="ov-note"></textarea><div class="err">Note required.</div></div></div><div class="m-f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="ovRevision('${id}')">Send back</button></div>`);return}
 const before=t.status;t.status=st;
 if(st==="completed"){logAudit("project_task.status_overridden","project_task",id,`${before} → completed (QC bypassed by manager)`);toast("Marked Completed — QC bypass logged.");}
 else logAudit("project_task.status_changed","project_task",id,`${before} → ${st}`);
 render();
}
function ovRevision(id){
 const n=$("#ov-note");if(!n.value.trim()){n.closest(".field").classList.add("invalid");return}
 const t=tasks.find(x=>x.id===id);t.status="revision";t.revNote=n.value.trim();
 logAudit("project_task.revision_requested","project_task",id,`note: "${t.revNote}"`);
 if(t.assignee)notify(t.assignee,`Revision requested on "${t.title}": ${t.revNote}`);
 closeModal();render();
}

/* LIST VIEW */
function vList2(pts,p){
 let rows=S.projFilter.assignee?pts.filter(t=>t.assignee===S.projFilter.assignee):pts;
 const months=[...new Set(rows.map(t=>t.month).filter(Boolean))].sort();
 const unassigned=rows.filter(t=>!t.assignee);
 let html=`<div class="lv-colhead"><div>Task</div><div>Owner</div><div>Status</div><div>Due date</div><div>Priority</div><div>Est</div><div></div></div>`;
 if(unassigned.length&&canReview(S.user)){
  const uk="un";const open=!S.collapsed[uk];
  html+=`<div class="unassign-banner"><div class="ub-head" onclick="S.collapsed['${uk}']=!S.collapsed['${uk}'];render()">
   <span style="font-size:11px">${open?"▾":"▶"}</span> Unassigned — needs a manager to assign <span style="margin-left:auto">${unassigned.length} task${unassigned.length>1?"s":""}</span></div>
   ${open?`<div>${unassigned.map(t=>taskRow(t,true)).join("")}</div>`:""}</div>`;
 }
 months.forEach(mn=>{
  const mk="m"+mn;const mRows=rows.filter(t=>t.month===mn);
  const cats=[...new Set(mRows.map(t=>t.cat))];
  const mDone=mRows.filter(t=>["approved","completed"].includes(t.status)).length;
  const mOpen=!S.collapsed[mk];const isCur=mn===p.month;
  html+=`<div class="month-grp"><div class="mg-head" onclick="S.collapsed['${mk}']=!S.collapsed['${mk}'];render()">
   <span class="mg-chevron">${mOpen?"▾":"▶"}</span>
   <b style="font-size:13.5px">Month ${mn} — ${MONTH_NAMES[mn]||mn}</b>
   <span style="font-size:12px;color:var(--mut);margin-left:4px">${mDone}/${mRows.length} done</span>
   ${isCur?`<span style="margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink)">Current cycle</span>`:""}
  </div>
  ${mOpen?cats.map(c=>{
   const ck=mk+"_"+c;const cRows=mRows.filter(t=>t.cat===c&&t.assignee);if(!cRows.length)return"";
   const cDone=cRows.filter(t=>["approved","completed"].includes(t.status)).length;const cOpen=!S.collapsed[ck];
   return `<div class="cat-grp"><div class="cg-head" onclick="S.collapsed['${ck}']=!S.collapsed['${ck}'];render()">
    <span class="cat-dot" style="background:${CAT_COLOR[c]||'#888'}"></span>
    <span style="font-size:13px;font-weight:700">${c}</span>
    <span style="font-size:12px;color:var(--mut);margin-left:3px">${cDone}/${cRows.length}</span>
    <span style="margin-left:auto;font-size:11px;color:var(--mut)">${cOpen?"▾":"▶"}</span>
   </div>
   ${cOpen?`<div>${cRows.map(t=>taskRow(t,false)).join("")}
    ${canReview(S.user)?`<div style="padding:7px 14px 7px 58px;border-bottom:1px solid var(--line2)"><button style="font-size:12px;color:var(--mut);font-weight:600" onclick="openNewTask()">＋ Add task in ${c}</button></div>`:""}</div>`:""}
   </div>`;
  }).join(""):""}</div>`;
 });
 return html;
}
function taskRow(t,unassigned){
 const done=["approved","completed"].includes(t.status);
 return `<div class="trow"><div class="t-name-cell" style="padding-left:${unassigned?14:58}px">
  <span class="t-circ ${done?"done-c":""}" onclick="event.stopPropagation()" title="${done?"":"Toggle status"}"></span>
  <span class="t-title" onclick="openTask('${t.id}')">${t.title}${t.status==="revision"?` <span class="pill sm" style="background:var(--red-soft);color:#a8331f;margin-left:4px">Needs revision</span>`:""}</span>
 </div>
 <div class="t-av">${t.assignee?av(byId(t.assignee),1):(canReview(S.user)?`<button class="btn ghost" style="padding:2px 7px;font-size:11px" onclick="event.stopPropagation();assignTask('${t.id}')">Assign</button>`:'<span class="mut" style="font-size:12px">—</span>')}</div>
 <div class="t-st" onclick="event.stopPropagation()">${statusPillSel(t)}</div>
 <div class="t-due ${t.due<0&&!done?"ov":""}">${fmtDate(t.due)}${t.due===0?" · Today":t.due<0?" · Overdue":""}${(t.subtasks||[]).length?`<div class="small mut" style="margin-top:2px;font-size:11px">${(t.subtasks||[]).filter(s=>s.done).length}/${(t.subtasks||[]).length} subtasks</div>`:""}</div>
 <div class="t-pr">${priPill(t.pri)}</div>
 <div class="t-est">${fmtHM(t.est)}</div>
 <div class="t-more"><button class="mut" onclick="event.stopPropagation();openTask('${t.id}')" style="font-size:16px;padding:2px 5px;color:var(--mut)">⋯</button></div>
 </div>`;
}
function assignTask(id){
 openModal(mhead("Assign task","Super admin is never assigned — by system design")+`
 <div class="m-b"><div class="field"><label>Assignee</label><select id="as-who">${users.filter(u=>u.active&&u.role!=="super_admin").map(u=>`<option value="${u.id}">${u.name} · ${u.title}</option>`).join("")}</select></div></div>
 <div class="m-f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doAssign('${id}')">Assign</button></div>`);
}
function doAssign(id){const t=tasks.find(x=>x.id===id);t.assignee=$("#as-who").value;
 logAudit("project_task.assigned","project_task",id,`assignee: ${byId(t.assignee).name}`);notify(t.assignee,`You were assigned "${t.title}".`);closeModal();render()}

/* BOARD VIEW */
function vBoard2(pts){
 const cols=[
  {key:"planned",label:"Not Started"},{key:"in_progress",label:"Working on it"},
  {key:"blocked",label:"Blocked"},{key:"submitted",label:"Awaiting Review"},
  {key:"revision",label:"Needs Revision"},{key:"approved",label:"Done ✓"},
 ];
 const unassigned=pts.filter(t=>!t.assignee);
 return `<div style="padding:14px">${unassigned.length&&canReview(S.user)?`<div class="unassign-banner" style="margin-bottom:14px">
  <div class="ub-head">📋 Unassigned (${unassigned.length}) — assign so work can begin
  </div><div style="display:flex;gap:10px;flex-wrap:wrap;padding:10px">${unassigned.map(t=>`<div class="kb-card" style="width:220px;margin:0" onclick="openTask('${t.id}')"><div class="kc-ttl">${t.title}</div><div class="kc-foot"><span class="cat-tag" style="background:${CAT_COLOR[t.cat]||'#888'}22;color:${CAT_COLOR[t.cat]||'#888'}">${t.cat}</span><button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();assignTask('${t.id}')">Assign</button></div></div>`).join("")}</div></div>`:""}
 <div class="kb-wrap">${cols.map(col=>{
  const ct=pts.filter(t=>t.status===col.key&&t.assignee);
  return `<div class="kb-col"><div class="kb-col-hd" style="border-top:3px solid ${STATUS[col.key].c}">
   <span class="pill sm" style="background:${STATUS[col.key].bg};color:${STATUS[col.key].fg}">${STATUS[col.key].l}</span>
   <span class="kb-ct">${ct.length}</span></div>
   ${ct.map(t=>{const sd=(t.subtasks||[]).filter(s=>s.done).length,st=(t.subtasks||[]).length;return `<div class="kb-card" onclick="openTask('${t.id}')">
    <div class="kc-ttl">${t.title}</div>
    <div class="kc-foot"><span class="cat-tag" style="background:${CAT_COLOR[t.cat]||'#888'}22;color:${CAT_COLOR[t.cat]||'#888'}">${t.cat}</span>
    <div style="display:flex;align-items:center;gap:5px">${priPill(t.pri)} ${av(byId(t.assignee),1)}</div></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--mut)">
     <span>${fmtDate(t.due)}</span>
     ${st?`<span style="background:var(--brand-soft);color:var(--brand-ink);padding:1px 6px;border-radius:4px;font-weight:600">☑ ${sd}/${st}</span>`:""}
    </div>
    ${t.due<0?`<div class="small" style="color:var(--red);margin-top:4px;font-weight:600">Overdue ${-t.due}d</div>`:""}</div>`}).join("")}
   ${canReview(S.user)?`<div style="padding:8px"><button style="width:100%;padding:8px;border:1px dashed var(--line);border-radius:7px;font-size:12px;color:var(--mut);font-weight:600" onclick="openNewTask()">+ Add task</button></div>`:""}
  </div>`;}).join("")}</div></div>`;
}

/* CALENDAR VIEW */
function vCalendar(pts){
 const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 // Aug 2026: Aug 1 = Saturday, so offset = 6
 const off=6;const total=off+31;const cells=Array.from({length:Math.ceil(total/7)*7},(_,i)=>i<off?null:i-off+1);
 return `<div style="padding:14px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
  <button class="btn ghost" onclick="toast('Previous month (demo).')">← Prev</button>
  <b style="font-size:15px">August 2026</b>
  <button class="btn ghost" onclick="toast('Next month (demo).')">Next →</button></div>
 <div class="cal-g">${days.map(d=>`<div class="ch">${d}</div>`).join("")}${cells.map(d=>{
  if(!d||d>31)return`<div class="cc" style="background:#f8fafb"></div>`;
  const dayTasks=pts.filter(t=>(8+t.due)===d&&!["cancelled"].includes(t.status));
  const isToday=d===8;
  return `<div class="cc ${isToday?"td":""}"><div class="cday">${isToday?`<span class="tn">${d}</span>`:d}</div>${dayTasks.map(t=>`<span class="ccal-chip" style="background:${CAT_COLOR[t.cat]||'#888'}22;color:${CAT_COLOR[t.cat]||'#888'}" onclick="openTask('${t.id}')" title="${t.title}">${t.title.length>20?t.title.slice(0,19)+"…":t.title}</span>`).join("")}</div>`;
 }).join("")}</div></div>`;
}

/* REVIEW, WORKLOAD, QA */
function vQueue2(pts){
 const rows=pts.filter(t=>t.status==="submitted");
 if(!canReview(S.user)&&S.user.role!=="admin_hr")return`<div class="empty">The review queue is a manager surface.</div>`;
 return `<div style="padding:14px">${rows.length?`<table class="tbl"><tr><th>Task</th><th>Submitted by</th><th>Routed to</th><th>Summary</th><th>Proof</th><th></th></tr>

function doSubmit(id){
 const t=tasks.find(x=>x.id===id);
 const sum=$("#sb-sum"),proof=$("#sb-proof");
 let ok=true;
 if(!sum.value.trim()){sum.closest(".field").classList.add("invalid");ok=false}
 if(t.checklist.some(c=>!c.done)){toast("Checklist has unchecked items — submission refused.",true);return}
 if(t.proofReq&&!proof.value.trim()){proof.closest(".field").classList.add("invalid");ok=false}
 if(!ok)return;
 t.status="submitted";t.proof=proof.value.trim()||t.proof;
 t.submission={by:S.user.id,summary:sum.value.trim(),hours:t.actual,issues:$("#sb-iss").value,reviewer:$("#sb-rev").value,at:fmtClock(S.clock)};
 logAudit("project_task.submitted","project_task",id,`status → submitted · reviewer: ${byId(t.submission.reviewer).name}`);
 notify(t.submission.reviewer,`${S.user.name} submitted “${t.title}” for your review.`);
 closeModal();render();toast("Submitted — now in the review queue.");
}

 </div>
 <div class="m-f"><button class="btn ghost" onclick="decide('${id}','revision')">⚠ Request revision</button><button class="btn primary" onclick="decide('${id}','approved')">✓ Approve</button></div>`);

function decide(id,dec){
 const t=tasks.find(x=>x.id===id);const note=$("#rv-note").value.trim();
 if(dec==="revision"&&!note){$("#rv-note").closest(".field").classList.add("invalid");return}
 t.reviews.push({by:S.user.id,decision:dec,note,rating:window._stars||null,meta:null,metaBy:null,at:"Just now"});
 if(dec==="approved"){t.status="approved";logAudit("project_task.approved","project_task",id,`status: submitted → approved${window._stars?` · rating ${window._stars}★`:""}`);notify(t.submission.by,`“${t.title}” was approved${window._stars?` — ${window._stars}★`:""}.`)}
 else{t.status="revision";t.revNote=note;logAudit("project_task.revision_requested","project_task",id,`note: “${note}”`);notify(t.submission.by,`Revision requested on “${t.title}”: ${note}`)}
 closeModal();render();toast(dec==="approved"?"Approved.":"Sent back for revision.");
}

/* ---- MONTH ACTIONS ---- */
function openAddMonth(tid){
 const t=tpls.find(x=>x.id===tid);
 const nextNum=t.months.length+1;
 const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
 // default: pick month matching nextNum, day 1
 const defMon=((nextNum-1)%12); // 0-indexed
 window._mwiz={
  tid, step:1,
  monthNum:nextNum,
  startMonth:defMon,   // 0-indexed
  startDay:1,
  cats:[],
  pendingTasks:{},
  activeCat:null,
  // subtask state per task: keyed by task temp id
  pendingSubs:{},
  activeSubInput:{},
 };
 renderMonthWizard();
}

const _MONTH_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function _daysIn(mon){return [31,29,31,30,31,30,31,31,30,31,30,31][mon]}
function _monthLabel(num,mon,day){return `Month ${num} — ${_MONTH_NAMES[mon]} ${day}`}

function mwizAddSub(catName,taskIdx){

function mwizSave(){
 const wiz=window._mwiz;
 const t=tpls.find(x=>x.id===wiz.tid);
 // Month 1: gets the user's chosen categories & tasks
 const m1id="m"+Date.now();
 const m1cats=wiz.cats.map((catName,ci)=>({
  id:"c"+Date.now()+"_"+ci,
  name:catName,
  tasks:wiz.pendingTasks[catName]||[],
 }));
 const m1Name="Month "+wiz.monthNum+" — "+_MONTH_NAMES[wiz.startMonth]+" "+wiz.startDay;
 t.months.push({
  id:m1id,num:wiz.monthNum,name:m1Name,
  startMonth:wiz.startMonth,startDay:wiz.startDay,
  cats:m1cats,
 });
 S.tplCollapsed[wiz.tid+"_"+m1id]=false;  // auto-expand Month 1
 // Months 2–12: empty scaffolds so user never has to manually create them again
 for(let i=1;i<12;i++){
  const num=wiz.monthNum+i;
  const mon=(wiz.startMonth+i)%12;
  const day=Math.min(wiz.startDay,_daysIn(mon));  // clamp day to valid range for that month
  const mid="m"+Date.now()+"_"+i;
  t.months.push({
   id:mid,num,
   name:"Month "+num+" — "+_MONTH_NAMES[mon]+" "+day,
   startMonth:mon,startDay:day,
   cats:[],
  });
  S.tplCollapsed[wiz.tid+"_"+mid]=true;  // collapse months 2–12 by default
 }
 const total=m1cats.reduce((a,c)=>a+c.tasks.length,0);
 const totalSubs=m1cats.reduce((a,c)=>a+c.tasks.reduce((b,tk)=>b+(tk.subtasks?.length||0),0),0);
 closeModal();render();
 toast(`All 12 months created — Month ${wiz.monthNum} has ${m1cats.length} categor${m1cats.length===1?"y":"ies"}, ${total} task${total!==1?"s":""}, ${totalSubs} subtask${totalSubs!==1?"s":""}. Months ${wiz.monthNum+1}–${wiz.monthNum+11} are empty scaffolds.`);
 window._mwiz=null;
}

/* Re-renders only the subtask list + count inside the open modal */
function tftRenderSubs(){
 const subs=window._tftSubs||[];
 const listEl=document.getElementById("tft-subs-list");
 const countEl=document.getElementById("tft-subs-count");
 if(!listEl)return;
 listEl.style.padding=subs.length?"8px 14px 4px":"0 14px";
 listEl.innerHTML=subs.map((s,i)=>`
  <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)">
   <span style="color:var(--mut);font-size:12px;flex-shrink:0">└</span>
   <span style="font-size:11.5px;font-weight:700;color:#a0b0bc;flex-shrink:0">${i+1}</span>
   <span style="flex:1;font-size:13px;font-weight:600">${s.title}</span>
   <button style="color:var(--mut);font-size:14px;padding:2px 6px;border-radius:5px;flex-shrink:0" onclick="window._tftSubs.splice(${i},1);tftRenderSubs()" title="Remove">×</button>
  </div>`).join("");
 if(countEl)countEl.textContent=subs.length+" subtask"+(subs.length!==1?"s":"");
 // clear input and refocus
 const inp=document.getElementById("tft-new-sub");
 if(inp){inp.value="";inp.focus();}
}

/* Reads the input, pushes to window._tftSubs, repaints list */
function tftAddSub(){
 const inp=document.getElementById("tft-new-sub");
 if(!inp)return;
 const v=inp.value.trim();
 if(!v){
  inp.style.borderColor="var(--red)";
  inp.placeholder="Type a subtask title first…";
  setTimeout(()=>{inp.style.borderColor="";inp.placeholder="New subtask title…"},1800);
  return;
 }
 if(!window._tftSubs)window._tftSubs=[];
 window._tftSubs.push({id:"st"+Date.now(),title:v});
 tftRenderSubs();
}

function saveTplTask(tid,mid,cid,taskId){
 const nm=$("#tft-title");if(!nm.value.trim()){nm.closest(".field").classList.add("invalid");return}
 const t=tpls.find(x=>x.id===tid);
 const m=t.months.find(x=>x.id===mid);
 const cat=m.cats.find(x=>x.id===cid);
 const rk=document.getElementById("tft-rk").value;
 const existing=taskId?cat.tasks.find(x=>x.id===taskId):null;
 const task={
  id:taskId||"tt"+Date.now(),
  title:nm.value.trim(),role:$("#tft-role").value,pri:$("#tft-pri").value,
  est:+$("#tft-est").value||2,ruleKind:rk,
  ruleVal:rk==="day"?+document.getElementById("tft-day").value:rk==="before"?+document.getElementById("tft-bval").value:null,
  ruleRef:rk==="after"?document.getElementById("tft-ref").value:null,
  qcGate:document.getElementById("tft-qc").checked,
  proofReq:document.getElementById("tft-proof").checked,
  checklist:document.getElementById("tft-cl").value.split("\n").map(x=>x.trim()).filter(Boolean),
  subtasks:(window._tftSubs||[]).map(s=>({id:s.id,title:s.title})),
 };
 if(taskId){const idx=cat.tasks.findIndex(x=>x.id===taskId);cat.tasks[idx]=task}
 else cat.tasks.push(task);
 closeModal();render();toast(taskId?"Task updated.":"Task added to "+cat.name+".");
}
function deleteTplTask(tid,mid,cid,taskId){
 if(!confirm("Delete this task?"))return;
 const t=tpls.find(x=>x.id===tid);
 const cat=t.months.find(x=>x.id===mid).cats.find(x=>x.id===cid);
 cat.tasks=cat.tasks.filter(x=>x.id!==taskId);
 closeModal();render();toast("Task deleted.");
}

function doStartProject(tid){
 const t=tpls.find(x=>x.id===tid);
 const nm=$("#sp-pname");if(!nm.value.trim()){nm.closest(".field").classList.add("invalid");return}
 const cid=$("#sp-client").value;
 const clientName=allClients.find(c=>c.id===cid)?.name||"Client";
 const roleMap={};document.querySelectorAll("[data-sp-role]").forEach(s=>{roleMap[s.dataset.spRole]=s.value||null});
 // flatten all tasks from months→cats→tasks using tplAllTasks (new data model)
 const allT=tplAllTasks(t);
 const pid="p"+Date.now();
 const projectName=nm.value.trim();
 // register the new project
 allProjects.push({id:pid,clientId:cid,name:projectName,type:t.cat,month:8,status:"active"});
 // generate one live task per template task
 allT.forEach((x,i)=>{
  const assignee=roleMap[x.role]||null;
  const title=x.title.replace(/{{ClientName}}/g,clientName);
  const due=x.ruleKind==="day"?(x.ruleVal-1):x.ruleKind==="before"?-(x.ruleVal):i+1;
  tasks.push({
   id:"tg"+Date.now()+"_"+i,
   pid,
   cat:x._catName,          // category name from the template
   month:x._monthNum,        // month number from the template
   title,
   assignee,
   due,
   pri:x.pri,
   est:x.est,
   actual:null,
   status:"planned",
   checklist:(x.checklist||[]).map(c=>({t:c,done:false})),
   subtasks:(x.subtasks||[]).map(s=>({id:s.id+"_live",title:s.title,done:false})),
   comments:[],
   proofReq:x.proofReq||false,
   proof:null,
   dependsOn:null,
   submission:null,
   reviews:[],
  });
 });
 logAudit("project.created","project",pid,`"${projectName}" cloned from template "${t.name}" — ${allT.length} tasks generated`);
 closeModal();
 // navigate to the new project
 S.projId=pid;
 S.projTab="list";
 S.projFilter.month="";   // show all months so all generated tasks are visible
 S.tplView.id=null;
 go("projects");
 toast(`"${projectName}" created — ${allT.length} tasks generated across ${t.months.length} month${t.months.length>1?"s":""}. Opening now.`);
}

  <p class="small" style="margin-bottom:8px"><b>${r.done}/${r.total}</b> planned tasks done · planned ${fmtHM(r.planH)} · actual ${fmtHM(r.actH)}</p>
  <div class="sec-lab">Note</div><p class="small">${r.note||"—"}</p>
  <div class="field" style="margin-top:14px"><label>Manager note (optional — required if flagging)</label><textarea id="eod-note">${r.mnote||""}</textarea></div>
 </div>
 <div class="m-f">
  <button class="btn ghost" onclick="ackEOD('${id}',true)">🚩 Flag — needs a conversation</button>
  <button class="btn primary" onclick="ackEOD('${id}',false)">✓ Mark reviewed</button>
 </div>`);
}
function ackEOD(id,flag){
 const r=eods.find(x=>x.id===id);const note=$("#eod-note").value.trim();
 if(flag&&!note){$("#eod-note").closest(".field").classList.add("invalid");toast("A note is required when flagging.",true);return}
 r.reviewedBy=S.user.id;r.flagged=flag;r.mnote=note||null;
 logAudit(flag?"eod_report.flagged":"eod_report.acknowledged","eod_report",id,flag?`flagged · “${note}”`:"reviewed","attendance");
 if(flag)notify(r.by,`Your EOD report (${r.date}) was flagged: “${note}”`);
 closeModal();render();toast(flag?"Flagged — the employee was notified.":"Marked reviewed — quietly (no notification).");
}

/* =============== LEAVE =============== */
function pgLeave(){
 const mgrView=isMgr(S.user);
 const rows=mgrView?leaves:leaves.filter(l=>l.by===S.user.id);
 const bal=Object.entries(quotas).map(([k,v])=>{const used=leaves.filter(l=>l.by===S.user.id&&l.status==="approved"&&(l.type===k||(k==="Casual"&&l.type==="Half-day"))).reduce((a,l)=>a+l.days,0);
  return `<div style="text-align:center;padding:12px 20px;border:1px solid var(--line2);border-radius:9px"><div style="font-weight:800;font-size:19px">${v-used}<span class="small mut">/${v}</span></div><div class="small mut">${k}</div></div>`}).join("");
 return `<div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">${bal}<span style="flex:1"></span><button class="btn primary" onclick="openLeaveReq()">+ Request leave</button></div>
 <div class="card"><table class="tbl"><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr>
 ${rows.map(l=>{const own=l.by===S.user.id;
  return `<tr><td>${byId(l.by).name}${own?' <span class="small mut">(you)</span>':""}</td>
  <td>${l.type}${l.half?` <span class="small mut">· ${l.half}`:""}</td><td class="small">${l.start}${l.end!==l.start?" – "+l.end:""}</td><td class="tnum">${l.days}</td>
  <td class="small mut" style="max-width:200px">${l.reason}</td>
  <td>${l.status==="pending"?'<span class="pill sm" style="background:var(--amber-soft);color:#8a5a12">Pending</span>':l.status==="approved"?'<span class="pill sm" style="background:var(--green-soft);color:#14683f">Approved</span>':'<span class="pill sm" style="background:var(--red-soft);color:#a8331f">Rejected</span>'}
  ${l.decidedBy?`<div class="small mut" style="margin-top:2px">by ${byId(l.decidedBy).name}${l.reversedBy?` · reversed by ${byId(l.reversedBy).name}`:""}</div>`:""}</td>
  <td style="white-space:nowrap">
   ${l.status==="pending"&&own?`<button class="btn ghost" style="padding:4px 10px" onclick="leaves=leaves.filter(x=>x.id!=='${l.id}');logAudit('leave.cancelled_by_requester','leave_request','${l.id}','withdrawn','leave');render()">Withdraw</button>`:""}
   ${l.status==="pending"&&(canReview(S.user)||S.user.role==="admin_hr")&&!own?`<button class="btn primary" style="padding:4px 11px" onclick="decideLeave('${l.id}','approved')">Approve</button> <button class="btn ghost" style="padding:4px 11px" onclick="decideLeave('${l.id}','rejected')">Reject</button>`:""}
   ${l.status!=="pending"&&["super_admin","admin_hr"].includes(S.user.role)&&!l.reversedBy?`<button class="btn ghost" style="padding:4px 10px" onclick="reverseLeave('${l.id}')">Reverse…</button>`:""}
  </td></tr>`}).join("")}</table></div>
 <p class="small mut" style="margin-top:12px">Any manager can decide any request — never their own. HR can reverse a decision (with a mandatory comment). Everything is logged.</p>`;
}
function openLeaveReq(){
 openModal(mhead("Request leave","Half-days deduct 0.5 from your quota")+`
 <div class="m-b">
  <div class="field"><label>Type</label><select id="lv-type" onchange="$('#lv-half').style.display=this.value==='Half-day'?'block':'none';lvPreview()"><option>Casual</option><option>Sick</option><option>Emergency</option><option>Half-day</option><option>Work from home</option></select></div>
  <div class="row2"><div class="field"><label>Start date</label><input id="lv-s" value="Aug 12" onchange="lvPreview()"></div><div class="field"><label>End date</label><input id="lv-e" value="Aug 13" onchange="lvPreview()"></div></div>
  <div class="field" id="lv-half" style="display:none"><label>Which half?</label><select><option>First half (arrive ~1:30 PM)</option><option>Second half (leave after 3h 30m net)</option></select></div>
  <div class="field"><label>Reason *</label><textarea id="lv-r"></textarea><div class="err">Reason required.</div></div>
  <div class="notice info" id="lv-prev">Counts as <b>2 working days</b> (Fri–Sat and holidays excluded) · 8 Casual remaining after approval.</div>
 </div>
 <div class="m-f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doLeaveReq()">Submit request</button></div>`);
}
function lvPreview(){const t=$("#lv-type").value;$("#lv-prev").innerHTML=t==="Half-day"?`Counts as <b>0.5 day</b> · timer target that day becomes <b>3h 30m</b> · break allowance 30m.`:`Counts as <b>2 working days</b> (Fri–Sat and holidays excluded).`}
function doLeaveReq(){
 const r=$("#lv-r");if(!r.value.trim()){r.closest(".field").classList.add("invalid");return}
 const type=$("#lv-type").value,half=type==="Half-day"?$("#lv-half select").value.split(" (")[0]:null;
 const l={id:"l"+Date.now(),by:S.user.id,type,start:$("#lv-s").value,end:type==="Half-day"?$("#lv-s").value:$("#lv-e").value,half,days:type==="Half-day"?0.5:2,reason:r.value.trim(),status:"pending",decidedBy:null,comment:null,reversedBy:null};
 leaves.unshift(l);logAudit("leave.requested","leave_request",l.id,`${type} · ${l.days} day(s)`,"leave");
 notifyMgrs(`${S.user.name} requested ${type} leave (${l.days} day${l.days>1?"s":""}).`);
 closeModal();render();toast("Leave request submitted.");
}
function decideLeave(id,dec){
 const l=leaves.find(x=>x.id===id);
 if(l.by===S.user.id){toast("You can't decide your own leave.",true);return}
 l.status=dec;l.decidedBy=S.user.id;
 logAudit(`leave.${dec}`,"leave_request",id,`status: pending → ${dec}`,"leave");
 notify(l.by,`Your ${l.type} leave (${l.start}) was ${dec} by ${S.user.name}.`);
 render();toast(dec==="approved"?"Approved.":"Rejected.");
}
function reverseLeave(id){
 openModal(mhead("Reverse leave decision","A comment is mandatory — a reversal always explains itself")+`
 <div class="m-b"><div class="field"><label>Comment *</label><textarea id="rv-lv"></textarea><div class="err">Comment required.</div></div></div>
 <div class="m-f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doReverse('${id}')">Reverse decision</button></div>`);
}
function doReverse(id){
 const c=$("#rv-lv");if(!c.value.trim()){c.closest(".field").classList.add("invalid");return}
 const l=leaves.find(x=>x.id===id);const before=l.status;
 l.status=before==="approved"?"rejected":"approved";l.reversedBy=S.user.id;l.comment=c.value.trim();
 logAudit("leave.reversed","leave_request",id,`${before} → ${l.status} · “${l.comment}”`,"leave");
 notify(l.by,`Your ${l.type} leave decision was reversed: now ${l.status}. “${l.comment}”`);
 if(l.decidedBy)notify(l.decidedBy,`Your decision on ${byId(l.by).name}'s leave was reversed by ${S.user.name}.`);
 closeModal();render();toast("Decision reversed and logged.");
}

function pgEmployees(){
 return `<div class="toolbar"><span style="flex:1"></span><button class="btn primary" onclick="openAddEmp()">+ Add employee</button></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">
 ${users.map(u=>`<div class="card" style="padding:16px 18px;${u.active?"":"opacity:.55"}">
  <div style="display:flex;gap:11px;align-items:center;margin-bottom:10px">${av(u)}<div><b>${u.name}</b><div class="small mut">${u.title}</div></div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="chip" style="background:var(--brand-soft);color:var(--brand-ink)">${ROLE_LABEL[u.role]}</span><span class="chip" style="background:var(--gray-soft);color:#5c6b7d">${u.dept}</span>${u.active?'<span class="chip" style="background:var(--green-soft);color:#14683f">Active</span>':'<span class="chip" style="background:var(--red-soft);color:#a8331f">Deactivated</span>'}</div>
  ${u.active&&u.id!==S.user.id?`<button class="btn ghost" style="width:100%" onclick="openDeact('${u.id}')">Deactivate…</button>`:u.active?'<p class="small mut">This is you.</p>':`<button class="btn ghost" style="width:100%" onclick="byId('${u.id}').active=true;logAudit('employee.reactivated','employee','${u.id}','active → true','employee');render()">Reactivate</button>`}
 </div>`).join("")}</div>
 <p class="small mut" style="margin-top:14px">New employees sign in with their company Google account — no invitation email exists. Provisioning is the invitation.</p>`;

function openAddEmp(){
 openModal(mhead("Add employee","They'll sign in with their company Google account — no invite email is sent")+`

  <div class="field"><label>Company email *</label><input id="ae-mail" placeholder="name@agency.com"><div class="err">Required.</div></div>
  <div class="row2"><div class="field"><label>Full name *</label><input id="ae-name"><div class="err">Required.</div></div>
  <div class="field"><label>Role</label><select id="ae-role"><option value="employee">Employee</option><option value="project_manager">Project Manager</option><option value="team_leader">Team Leader</option><option value="admin_hr">Admin / HR</option></select></div></div>

function doAddEmp(){
 const m=$("#ae-mail"),n=$("#ae-name");let ok=true;
 if(!m.value.trim()){m.closest(".field").classList.add("invalid");ok=false}
 if(!n.value.trim()){n.closest(".field").classList.add("invalid");ok=false}
 if(!ok)return;
 const u={id:"u"+Date.now(),name:n.value.trim(),role:$("#ae-role").value,title:$("#ae-title").value||"—",dept:$("#ae-dept").value||"—",active:true};
 users.push(u);logAudit("employee.created","employee",u.id,`${u.name} · ${ROLE_LABEL[u.role]}`,"employee");
 closeModal();render();toast(`${u.name} provisioned — they can sign in with Google now.`);
}
function openDeact(id){
 const u=byId(id);
 const open=tasks.filter(t=>t.assignee===id&&!["approved","completed","cancelled"].includes(t.status));
 const routed=tasks.filter(t=>t.status==="submitted"&&t.submission?.reviewer===id);
 const mgrLeft=users.filter(x=>x.active&&canReview(x)&&x.id!==id).length;
 if(canReview(u)&&mgrLeft<2){openModal(mhead("Cannot deactivate",u.name)+`<div class="m-b"><div class="notice warn">Deactivating ${u.name.split(" ")[0]} would leave fewer than 2 active managers — the review system would deadlock. Promote someone first.</div></div><div class="m-f"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);return}
 openModal(mhead(`Deactivate ${u.name}`,"Every open item must be resolved first — then everything applies in one transaction")+`
 <div class="m-b">
  ${open.length?`<div class="sec-lab">Open tasks assigned to ${u.name.split(" ")[0]} (${open.length})</div>
  ${open.map((t,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)"><span style="flex:1"><b class="small">${t.title}</b></span>
  <select data-dx="${t.id}" onchange="dxCheck()"><option value="">Choose…</option>${users.filter(x=>x.active&&x.id!==id&&x.role!=="super_admin").map(x=>`<option value="${x.id}">Reassign → ${x.name}</option>`).join("")}<option value="cancel">Cancel the task</option></select></div>`).join("")}`:'<p class="small mut">No open task assignments. ✓</p>'}
  ${routed.length?`<div class="sec-lab">Reviews routed to ${u.name.split(" ")[0]} (${routed.length})</div>
  ${routed.map(t=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)"><span style="flex:1"><b class="small">${t.title}</b></span>
  <select data-dr="${t.id}" onchange="dxCheck()"><option value="">Re-route…</option>${users.filter(x=>x.active&&canReview(x)&&x.id!==id&&x.id!==t.submission.by).map(x=>`<option value="${x.id}">→ ${x.name}</option>`).join("")}</select></div>`).join("")}`:'<p class="small mut">No routed reviews. ✓</p>'}
  <div class="notice warn" style="margin-top:14px">On confirm: sessions killed instantly · pending leave auto-rejected · today's attendance auto-closed · everything audited.</div>
 </div>
 <div class="m-f"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="dx-go" ${open.length||routed.length?"disabled":""} onclick="doDeact('${id}')">Deactivate</button></div>`,true);
}
function dxCheck(){const all=[...document.querySelectorAll("[data-dx],[data-dr]")];$("#dx-go").disabled=all.some(s=>!s.value)}
function doDeact(id){
 const u=byId(id);
 document.querySelectorAll("[data-dx]").forEach(s=>{const t=tasks.find(x=>x.id===s.dataset.dx);
  if(s.value==="cancel"){t.status="cancelled";logAudit("project_task.status_changed","project_task",t.id,"→ cancelled (offboarding)")}
  else{t.assignee=s.value;logAudit("project_task.assigned","project_task",t.id,`reassigned → ${byId(s.value).name} (offboarding)`);notify(s.value,`You were reassigned “${t.title}”.`)}});
 document.querySelectorAll("[data-dr]").forEach(s=>{const t=tasks.find(x=>x.id===s.dataset.dr);t.submission.reviewer=s.value;
  logAudit("submission.rerouted","project_task",t.id,`reviewer → ${byId(s.value).name} (offboarding)`);notify(s.value,`A review was re-routed to you: “${t.title}”.`)});
 leaves.filter(l=>l.by===id&&l.status==="pending").forEach(l=>{l.status="rejected";l.comment="Auto-rejected on deactivation";logAudit("leave.rejected","leave_request",l.id,"auto-rejected on deactivation","leave")});
 u.active=false;logAudit("employee.deactivated","employee",id,"active → false · sessions killed","employee");
 closeModal();render();toast(`${u.name} deactivated — locked out on their next request.`);
}
